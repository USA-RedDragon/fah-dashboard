<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folding Month IX</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>LTT <span>Folding Month IX</span></h1>
    <div class="status" id="status"></div>
  </header>
  <div id="error" class="loading" hidden></div>
  <div class="tiles" id="tiles"></div>
  <div class="split">
    <section class="card">
      <div class="head">
        <h2>Participants</h2>
        <input type="search" id="search" placeholder="Find a folder" aria-label="Find a folder">
      </div>
      <div class="scroll"><table id="board"></table></div>
      <p class="note">Points since Nov 1 00:00 UTC. ~ means estimated, because F@H only publishes exact monthly totals for its top 1000 folders.</p>
      <details class="note" id="unresolved" hidden><summary></summary><p></p></details>
    </section>
    <div class="stack">
      <section class="card">
        <h2>Team race this event</h2>
        <div class="bars" id="teams"></div>
      </section>
      <section class="card">
        <h2>F@H network</h2>
        <div class="scroll"><table id="network" class="plain"></table></div>
        <p class="note" id="networkNote"></p>
      </section>
    </div>
  </div>
</div>
<script src="/app.js"></script>
<script>initOverview();</script>
</body>
</html>
