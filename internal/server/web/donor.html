<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder - Folding Month IX</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="name"></h1>
    <div class="status"><a href="/">All participants</a> · <span id="status"></span></div>
  </header>
  <div id="error" class="loading" hidden></div>
  <div class="tiles" id="tiles"></div>
  <section class="card">
    <h2>Points and forecast to Dec 6</h2>
    <div class="chart" id="growth"></div>
    <p class="note" id="forecastNote"></p>
  </section>
  <div class="pair">
    <section class="card"><h2>Rank over time</h2><div class="chart" id="rank"></div></section>
    <section class="card"><h2>Points per day (UTC)</h2><div class="chart" id="daily"></div></section>
  </div>
  <div class="pair">
    <section class="card"><h2>Prize and badge minimums</h2><ul class="check" id="minimums"></ul></section>
    <section class="card"><h2>Nearest rivals</h2><div class="rivals" id="rivals"></div></section>
  </div>
</div>
<script src="/app.js"></script>
<script>initDonor();</script>
</body>
</html>
